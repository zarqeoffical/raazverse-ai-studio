name: Build Short Video

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/**"
      - "content/**"
      - "render.py"
      - ".github/workflows/build-short.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render vertical Short
        run: python render.py
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: raazverse-short-video
          path: output/raazverse_short.mp4
          if-no-files-found: error
          retention-days: 7
